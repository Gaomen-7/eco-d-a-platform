# Docker Compose — eco-a-d-platform P0 骨架
#
# 约束来源（逐条对应 HLD §4 与 gdd §1.7）：
#   - 逐服务显式 mem_limit **且** memswap_limit（等值）——只设 memory 时容器可借等量 swap（官方明文），
#     不写 memswap_limit 则 8 GB 判据有渗漏点。见 HLD §4.2。
#   - **不写** deploy.resources.limits.*（deploy 是可选段，且与 mem_limit 并存时官方要求二者一致，
#     写错一个即自相矛盾）。
#   - 端口一律 `127.0.0.1:H:C`；不写 host IP 会绑 0.0.0.0 并绕过宿主防火墙（官方明文）。
#   - 日志轮转 10 MB × 3。
#   - named volume 持久化；Doris 侧是**必需**（官方 Docker 部署容器销毁即丢数据）。
#   - Doris FE `-Xmx` 与 BE `mem_limit` **必须显式下调**：出厂默认分别是 8192m 与 90%，
#     按默认必然击穿天花板。见 HLD §8-R1、gdd §A.2。
#
# ⚠️ 镜像来源：本机 registry-1.docker.io **不可达**，官方镜像经中国镜像站拉取（P0 实测可用）。
#    生产/他机复现时可通过 ${REGISTRY_MIRROR:-docker.m.daocloud.io} 覆盖。

name: eco-a-d-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─────────────────────────────────────────────────────────────
  # ① 消息队列：Kafka 4.3.1（KRaft combined，无 ZooKeeper）
  # ─────────────────────────────────────────────────────────────
  kafka:
    image: ${REGISTRY_MIRROR:-docker.m.daocloud.io}/apache/kafka:4.3.1
    container_name: eco-kafka
    hostname: kafka
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      # ★ 双 listener（2026-10-21 实机证伪后补）：**单 listener 无法同时满足
      #   容器内与宿主两侧**。原先只有 PLAINTEXT://kafka:9092，端口映射虽在，
      #   但客户端连上 127.0.0.1:9092 后 broker 回的元数据是 `kafka:9092`，
      #   宿主解析不了该主机名 ⇒ 实机报：
      #     %3|FAIL|ecomgen#producer-1| [thrd:kafka:9092/1]:
      #       Failed to resolve 'kafka:9092': Temporary failure in name resolution
      #   ⇒ 投递 434 条全部滞留队列，topic offset 恒 0。
      #   而 Makefile 的 `spike` 目标就是从**宿主**跑 `ecomgen live`，必须有这条路。
      #   ⇒ 修法：加 HOST listener，advertised 成宿主可达的 127.0.0.1:29092。
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL=kafka:9092（compose 网内，Flink/init-kafka 用）
      # HOST=127.0.0.1:29092（宿主 ecomgen live / Makefile spike 用）
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # RF=1（单机）；见 gdd §1.2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # ★★ 必须显式设 log.dirs（P0 实测踩到的 REQ-F-ORCH-05 缺陷）★★
      #   官方镜像的默认是 `log.dirs=/tmp/kraft-combined-logs`（见
      #   /opt/kafka/config/server.properties:73）。**/tmp 是容器内路径，
      #   down/up 后清空 ⇒ 数据全丢**，named volume 形同虚设。
      #   实测证据：down 前 partition 2/3 各有 1 条记录，down/up 后 offsets 全归 0。
      #   故必须把 log.dirs 指到挂载卷内。
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # ★ P0 实测修正：原来的探针用 `kafka-broker-api-versions.sh`，它每次都要
      #   起一个 **JVM**，实测耗时 **37.7s**，而 timeout 只有 10s ⇒ 永远超时、
      #   容器长期显示 `unhealthy`（实测 FailingStreak=22），但**功能完全正常**
      #   （topic / offsets / 生产消费都可用）。这是**探针太重**，不是服务坏了。
      #   ⇒ 改用**轻量 TCP 连通性探针**（实测 4.6s，且不依赖 JVM）。
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/9092' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    logging: *default-logging

  # 初始化一次性服务：建 topic、施加 retention/分区数（REQ-F-MQ-01..04）
  kafka-init:
    image: ${REGISTRY_MIRROR:-docker.m.daocloud.io}/apache/kafka:4.3.1
    container_name: eco-kafka-init
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-kafka.sh"]
    volumes:
      - ./docker/scripts:/scripts:ro
    restart: "no"
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # ② 流处理：Flink 2.2（JM + TM）
  #    ⚠️ process.size 官方**无默认值**，不配则启动失败（官方明文）
  # ─────────────────────────────────────────────────────────────
  flink-jm:
    # ★ 本地构建镜像（impl-03a）：官方 apache/flink:2.2-java17 **不含** Paimon；
    #   Paimon bundled connector jar 必须在**构建期** COPY 进 /opt/flink/lib
    #   （官方逐字："Install one matching Paimon bundled connector in **each**
    #    Flink process."）。改用本地 tag 后，JM/TM **两个进程**都自带 jar。
    #   ⚠️ `ADD JAR` 指向**宿主**路径不可行（宿主机路径对容器不可见，且 Flink 的
    #      ADD JAR 只认 Flink 可见的文件系统）⇒ 只能构建期进 lib，**不需要** ADD JAR。
    #   先例与写法同 doris（${DORIS_IMAGE:-​eco/doris:4.1.5}）。
    #   构建： docker build -f docker/flink/Dockerfile -t eco/flink:2.2-paimon docker/flink
    image: ${FLINK_IMAGE:-eco/flink:2.2-paimon}
    container_name: eco-flink-jm
    hostname: flink-jm
    mem_limit: 1g
    memswap_limit: 1g
    command: ["jobmanager"]
    ports:
      - "127.0.0.1:8081:8081"
    # ★ P0 实测修正：Flink 2.2 的配置文件是 **config.yaml（YAML 格式）**，不是 flink-conf.yaml，
    #   也不吃 FLINK_PROPERTIES 那套点号键。镜像自带 config.yaml 且已含
    #   jobmanager.memory.process.size: 1600m ⇒ 官方「不配则启动失败」的前提由镜像默认满足。
    #   这里改用 config.yaml 覆盖（只写差异项）。
    #   ⚠️ **不能把空目录 bind 进 /opt/flink/conf**：那会遮住镜像自带的 config.yaml，
    #      导致 "The Flink config file ... does not exist" 启动失败（P0 实测踩到）。
    volumes:
      - ./docker/flink/conf/config.yaml:/opt/flink/conf/config.yaml:ro
      # ★ /warehouse ＝ 后续 catalog DDL 里要写的那个 warehouse 路径（impl-03a 只钉路径，
      #   不写 DDL）。**必须与 flink-tm 的容器内路径逐字相同**（同为 /warehouse）：
      #   Paimon 把绝对路径写进 catalog/表元数据，两侧路径一旦不同即读不到同一份数仓。
      #   ⚠️ 本行**不得**改成别的容器内路径。
      - paimon-warehouse:/warehouse
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    logging: *default-logging

  flink-tm:
    # ★ 与 flink-jm **同一个本地镜像**：官方逐字要求 Paimon bundled connector 装在
    #   "each Flink process"；JM 与 TM 不互通 ⇒ 只装一个等于没装（TM 才是真正
    #   执行批任务、写 warehouse 的那个进程）。构建命令见 flink-jm 上方注释。
    image: ${FLINK_IMAGE:-eco/flink:2.2-paimon}
    container_name: eco-flink-tm
    hostname: flink-tm
    mem_limit: 2g
    memswap_limit: 2g
    command: ["taskmanager"]
    depends_on:
      flink-jm:
        condition: service_healthy
    volumes:
      - ./docker/flink/conf/config.yaml:/opt/flink/conf/config.yaml:ro
      # ★ 与 flink-jm **逐字相同**的挂载（paimon-warehouse:/warehouse）：两容器是
      #   两个独立文件系统，只有「同一具名卷 + 同一容器内路径」才构成 Paimon 需要的
      #   shared storage（官方把 `file:` warehouse 只背书到 "single-machine tutorial"，
      #   分布式集群须 shared storage）。JM 提交的批作业在 TM 上执行，两侧都必须
      #   解析出**同一个绝对路径** /warehouse。
      #   ⚠️ 本行**不得**改成别的容器内路径（与 flink-jm 那行互为约束）。
      - paimon-warehouse:/warehouse
    # ★ 健康判据＝TM 进程**真的在**（impl-02e 补）：此前本服务**没有 healthcheck**，
    #   `docker compose ps` 的 HEALTH 列是 `<no value>` ⇒ 票面验收第 1 条
    #   「ps 全 healthy」结构上永远无法成立（不是机器慢，是判据不存在）。
    #   ⚠️ 不能用「TM 已向 JM 注册」当判据：verify-fault 会 kill TM 再 docker start，
    #      期间 JM 侧注册必然短暂消失；用 JM 当判据会让健康态随故障演练抖动。
    #   ⇒ 只判**本容器内 TaskManagerRunner 存活**（liveness，不判连接态）。
    #   pgrep 在镜像内实测存在（/usr/bin/pgrep）；start_period 覆盖 JVM 启动。
    #   ★★ 模式必须写成 `[T]askManagerRunner`（方括号技巧），**不能**写全名 ★★
    #   CMD-SHELL 会执行 `/bin/sh -c '<整条 test 字符串>'`，而该 shell 自己的 cmdline
    #   **逐字包含** test 里的模式 ⇒ `pgrep -f <全名>` 会匹配到 shell 自己，
    #   于是 TM 进程死了也照样 exit 0 —— 判据**恒真**，正是本票在修的同一个病。
    #   实机取证（2026-10-22）：
    #     docker exec eco-flink-tm sh -c 'pgrep -f zzzz_no_such_processor_xyz && echo SELF_MATCH'
    #     → SELF_MATCH            （不存在的进程名也「匹配成功」＝匹配到了 shell 自己）
    #     docker exec eco-flink-tm sh -c 'pgrep -f "[z]zzz_no_such_processor_xyz" && echo SELF_MATCH || echo NO_MATCH'
    #     → NO_MATCH              （方括号让 shell 的 cmdline 不含字面量，只剩真进程）
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[T]askManagerRunner' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    restart: unless-stopped
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # ③ OLAP：Doris 4.1.5（FE + BE）
  #    ★ 出厂默认 -Xmx8192m ＝ 整个 8 GB 预算 ⇒ 必须显式下调
  #    ★ BE mem_limit 出厂默认 90% ⇒ 必须显式下调
  #    ★ 镜像必须**本地构建**（官方无版本化镜像）；归入 profile "doris"
  #      ⇒ 未构建时 `docker compose up` **不会**因此失败（P0 骨架先以
  #        Kafka+Flink+Superset 验证，Doris 就绪后再 `--profile doris` 纳入）。
  #      构建： docker build -f docker/doris/Dockerfile -t eco/doris:4.1.5 docker/doris
  # ─────────────────────────────────────────────────────────────
  doris-fe:
    image: ${DORIS_IMAGE:-eco/doris:4.1.5}
    container_name: eco-doris-fe
    hostname: doris-fe
    mem_limit: 2g
    memswap_limit: 2g
    profiles: ["doris"]
    command: ["fe"]
    # ★★ Bug H（P0 实测，2026-10-20）——**必须固定 IP，否则 down/up 后 FE 永远起不来** ★★
    #   症状：`docker compose down`（不删卷）后再 `up`，FE 卡在
    #     `Env.waitForReady(): wait catalog to be ready. feType:UNKNOWN isReady:false`
    #     无限循环，healthcheck 连续失败（实测 FailingStreak=18）。
    #   根因：Doris 把**自己的 IP** 写进持久化元数据（`doris-meta`）：
    #     首次启动日志逐字：`FrontendOptions.initAddrUseIp(): local address: /172.22.0.6`
    #                      `Env.getSelfHostPort(): get self node: HostInfo{host='172.22.0.6', port=9010}`
    #     而 Docker 在容器重建时会**重新分配**网络内 IP（实测重建后 FE 变成 172.22.0.3）
    #     ⇒ 元数据里的 `172.22.0.6:9010` 与实际的自己**对不上** ⇒ FE 找不到自己，永久卡住。
    #   ⇒ 修法：**固定默认网络的子网**并给 FE/BE **钉死 IP** —— 这正是官方
    #      all-in-one `compose/multi-node.yml` 的做法，官方原注逐字：
    #      "Node addresses are pinned inside the private network, so a restarted
    #       container keeps the identity Doris knows it by."
    #   ⚠️ 为什么不另建一个只为 Doris 的网络：HLD §4.4 明确「Flink TM 本就**在
    #      compose 网内**」⇒ P1 的 Flink-Doris-Connector 必须能按容器地址直接
    #      连到 BE。若把 FE/BE 挪到**独立**网络，Flink TM（仍在 default）就**够不到**
    #      它们，会打断 P1 写入路径。故改为：**重定义 default 网络为固定子网**，
    #      其它服务不带 `networks:` 键 ⇒ 仍自动加入同一个 default 网络，
    #      FE/BE 则在该网络内钉死 IP。**拓扑不变，只是 IP 稳定**。
    networks:
      default:
        ipv4_address: 172.31.88.40
    environment:
      # ⚠️ 真正的 -Xmx 覆盖在**镜像构建期**完成（fe.conf 的 JAVA_OPTS_FOR_JDK_17）。
      #    start_fe.sh 会先用 `-Xmx1024m` 再用 fe.conf 覆盖，故这里再设一层保险。
      JAVA_OPTS_FOR_JDK_17: "-Xmx1536m -Xms1536m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError"
      # ★ 本镜像是**自写 entrypoint**（docker/doris/entrypoint.sh），它消费的变量：
      FE_HOST: doris-fe
      FE_PORT: "9030"
      FE_USER: root
      # ⚠️ 已删除 `FE_SERVERS: fe@doris-fe:9010` 与 `FE_ID: "1"`（P0 实测 2026-10-20）：
      #    这两个是**官方 k8s operator** 的约定，只被官方的 fe_entrypoint.sh 消费；
      #    本镜像的 entrypoint 与 `start_fe.sh`/`start_be.sh` 都**不读**它们
      #    （在真 tar 包 fe/bin + be/bin 整目录 grep ⇒ 零命中）⇒ 原属**死配置**。
    ports:
      - "127.0.0.1:8030:8030"   # FE HTTP（/api/health）
      - "127.0.0.1:9030:9030"   # FE MySQL 协议（看板/客户端）
      - "127.0.0.1:9010:9010"   # edit_log
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8030/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging

  doris-be:
    image: ${DORIS_IMAGE:-eco/doris:4.1.5}
    container_name: eco-doris-be
    hostname: doris-be
    mem_limit: 3g
    memswap_limit: 3g
    profiles: ["doris"]
    command: ["be"]
    # ★ Bug H 同理：BE 也必须钉死 IP（它把自身地址报给 FE，见 doris-fe 的说明）。
    #   ⚠️ BE 注册用的**容器 IP** 由此确定为 172.31.88.50，
    #      与 docker/doris/entrypoint.sh 的 `my_ip()` 取值一致。
    networks:
      default:
        ipv4_address: 172.31.88.50
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      # ★ 自写 entrypoint 消费的变量（见 docker/doris/entrypoint.sh 文件头 Bug D/F 说明）：
      #   它会在**起 BE 进程之前**，用容器 IP 发 `ALTER SYSTEM ADD BACKEND`，
      #   并等到 `SHOW BACKENDS` 的 Alive=true 才放手 —— 与官方 all-in-one
      #   的 `run_be()`（resolve_master → register_be → start_be）同构。
      #   ⚠️ 顺序承重：BE 的 conf 里没有 FE 地址，BE 靠「FE 注册后主动来连它」
      #      的握手才知道向谁心跳 ⇒ 必须先注册、后起进程。
      FE_HOST: doris-fe
      FE_PORT: "9030"
      FE_USER: root
      BE_HEARTBEAT_PORT: "9050"
      START_TIMEOUT: "300"
      # ⚠️ 已删除 `FE_SERVERS: fe@doris-fe:9010` 与 `BE_ADDR: doris-be:9050`（死配置，
      #    同上）。**注意**：`BE_ADDR` 原写的是**主机名**，而 fe.conf 出厂没有
      #    `enable_fqdn_mode` 行 ⇒ 走默认 **IP 语义**（官方 FE entrypoint：
      #    `parse enable_fqdn_mode` 非 true 时 `MYSELF=$POD_IP`）⇒ 即便它被读，
      #    主机名写法也是错的。正确写法是**容器 IP**：见 entrypoint.sh 的 my_ip()。
      # ⚠️ BE 的 mem_limit 覆盖主要在**镜像构建期**（be.conf: 90% → 25%）。
    ports:
      - "127.0.0.1:8040:8040"   # BE webserver（/metrics 等）
      - "127.0.0.1:9060:9060"   # BE brpc
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8040/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # ④ 看板：Superset 6.1.0（按 R3 降配 A 裁掉 worker/beat）
  #    ⚠️ 默认**非零账号**，REQ-F-BI-03 须显式配置 AUTH_ROLE_PUBLIC
  #    ★ P0 实测发现：官方 superset:6.1.0 镜像**不含任何 DB 驱动**
  #      （psycopg2 / psycopg / mysqlclient / pymysql 全部 MISSING）
  #      ⇒ 元数据库不能直接用 Postgres；两条处置见下。
  #    ★ 处置：元数据库用 **SQLite**（镜像自带 sqlite3，零驱动依赖）；
  #      `ecom_ads` 连接所需的 MySQL 驱动经官方机制
  #      `/app/docker/requirements-local.txt` 在引导时自动 pip 安装
  #      （docker-bootstrap.sh:35 逐字确认该路径）。
  # ─────────────────────────────────────────────────────────────
  superset:
    image: ${REGISTRY_MIRROR:-docker.m.daocloud.io}/apache/superset:6.1.0
    container_name: eco-superset
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?须在 .env 设置，勿入库}
      # R3 降配 A：CELERY_CONFIG=None 关闭全部 celery 配置 ⇒ worker/beat 可整段不写
      SUPERSET_LOAD_EXAMPLES: "no"
      # 元数据库：SQLite（避开镜像无 psycopg2 的缺口）
      SUPERSET_DB_URI: "sqlite:////app/superset_home/superset.db"
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./docker/superset/requirements-local.txt:/app/docker/requirements-local.txt:ro
      - superset-home:/app/superset_home
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health | grep -q OK || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # ⑤ client：按需拉起（docker compose run --rm client）
  #    ★ 存在的唯一理由：Doris Stream Load 的 FE→BE 第二跳是**容器地址**，
  #      宿主/Docker Desktop 都 follow 不到 ⇒ 导入必须从 compose 网内发起。
  #      见 HLD §4.4（官方原话）。
  #    ⚠️ 不常驻：不占常驻预算（profile 隔离，或在 Makefile 里用 run --rm）
  # ─────────────────────────────────────────────────────────────
  client:
    image: ${REGISTRY_MIRROR:-docker.m.daocloud.io}/mysql:8.0
    container_name: eco-client
    mem_limit: 256m
    memswap_limit: 256m
    profiles: ["client"]
    # ★ `exec "$@"` 派发器（P0 实测，2026-10-20）——旧写法 `["/bin/bash","-c","sleep infinity"]`
    #   会把 `docker compose run client <cmd...>` 传入的命令整条丢成 `$0`：
    #     实测 `... client echo SHOULD_PRINT` 一次都没打印；
    #          `... client mysql -h doris-fe -P 9030 -u root -e "SELECT 1"`
    #          退回本地 socket 报 `ERROR 2002 ... mysqld.sock`（参数全丢）。
    #   根因：`bash -c` 只把**紧跟的单个参数**当脚本文本，其余全丢进 `$0`/`$@`。
    #   修法：`dummy` 占住 `$0`，真实参数从 `$1` 起算，`exec "$@"` 原样派发。
    #   ⚠️ 两处不可省：① `dummy` 占位；② `command` 必须**双元素**——实测单元素
    #      `["sleep infinity"]` 会报 `exec: sleep infinity: not found`。
    entrypoint: ["/bin/bash", "-c", "exec \"$@\"", "dummy"]
    command: ["sleep", "infinity"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/scripts:/scripts:ro
      # ★ 补齐 init.sql 的默认路径（Bug C，P0 实测）——三方曾不一致：
      #   `doris-init.sh` 默认 SQL_FILE=/scripts/doris/init.sql；
      #   compose 只挂 ./docker/scripts ⇒ 容器内 `/scripts/doris` **不存在**
      #   （实测 `--entrypoint ls client /scripts` 只有 doris-init.sh、init-kafka.sh）；
      #   而文件真实位置是 docker/doris/init.sql。
      #   ⇒ 加一条挂载补齐。**不要**改上面那条挂载的根：`kafka-init` 依赖
      #     `/scripts/init-kafka.sh`，改根会连累它。
      #
      #   ⚠️ **挂到 /doris 而非 /scripts/doris**（实测踩到，2026-10-20）：
      #     挂 `/scripts/doris` 会直接**起不来容器**——
      #       `runc create failed: ... error mounting ... to rootfs at "/scripts/doris":
      #        make mountpoint for /scripts/doris mount: mkdirat ...: read-only file system`
      #     根因：`/scripts` 本身是**只读绑定**，runc 无法在其内部再创建挂载点目录。
      #     ⇒ 挂到**非嵌套**路径 `/doris`，并把 `doris-init.sh` 的默认值同步改为
      #       `/doris/init.sql`（两处已对账一致）。
      - ./docker/doris:/doris:ro
    # ★ 健康判据＝mysql 客户端**可用**（impl-02e 补）：此前本服务**没有 healthcheck**，
    #   ps 的 HEALTH 列是 `<no value>` ⇒ 票面验收第 1 条「ps 全 healthy」结构上不成立。
    #   判 `mysql --version` 而不是连 FE：本服务是「按需拉起的工具容器」，
    #   Doris 尚未起来时它仍应算健康（Doris 的健康是 doris-fe/be 自己的事）。
    #   ⚠️ 镜像内**没有** pgrep（实测 command not found），故不用进程判据。
    #   ⚠️ 下列数字全为**设计值**（非官方保证）：interval 15 s 与 flink-jm 对齐；
    #      start_period 10 s 覆盖 `mysql --version` 的冷启动（实测 <1 s，留 10 倍余量）。
    #      不留 30 s interval：那会让 start_period 形同虚设（首个探针要等 30 s）。
    healthcheck:
      test: ["CMD-SHELL", "mysql --version >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: "no"
    logging: *default-logging

volumes:
  kafka-data:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:
  superset-home:
  # ★ Paimon warehouse（impl-03a）：Flink JM 与 TM 是**两个独立容器**，
  #   彼此的 /opt/flink/... 与容器可写层都**不互通** ⇒ 若各自用容器内临时路径，
  #   `down`/`up` 一次数据即丢，且两进程根本读不到同一份数仓（正是本票要防的错）。
  #   故用 **named volume**（与 kafka-data 同理：容器内路径 down/up 即清空）。
  #   ⚠️ 官方对 `file:` warehouse 的背书**仅限 "single-machine tutorial"** 场景，
  #      分布式集群（JM/TM 分容器即属此列）须 **shared storage** ⇒ 本仓以
  #      具名卷充当该 shared storage（单机共享存储的等价物）。
  paimon-warehouse:

# ★ Bug H（P0 实测，2026-10-20）：把 **default 网络重定义为固定子网**，
#   以便给 Doris FE/BE 钉死 IP（原因见 doris-fe 服务注释：Doris 把自身 IP
#   持久化进元数据，重建后 IP 一变即永久卡在 feType:UNKNOWN）。
#   ⚠️ 只**重定义**、不新增网络：其余服务都不写 `networks:` 键 ⇒ 仍自动加入
#      这个同一个 default 网络 ⇒ **拓扑不变**，Flink TM 照样能按容器地址连 BE
#      （HLD §4.4 的 P1 写入路径不受影响）。
#   子网选 172.31.88.0/24：与官方 multi-node 示例的 172.31.81.0/24 **错开**，
#   也避开 Docker 默认 bridge 池，避免与本机其它 compose 项目撞段。
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.88.0/24
