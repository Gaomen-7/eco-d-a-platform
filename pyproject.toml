[project]
name = "ecomgen"
version = "0.0.0"
description = "电商用户行为数据生成器（模块①）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka==2.16.0",
    "faker==40.43.0",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecomgen"]

[tool.ruff]
target-version = "py312"
# 与 formatter 冲突的规则默认不开（HLD §3.3.1 列出的官方冲突集）。
# 本仓不启用 W191/E111/E114/E117/D203/D206/D300/Q000-Q004/COM812/COM819。
src = ["src"]

[tool.ruff.lint]
# import 排序归 ruff 独占；格式化归 `ruff format`（formatter 不排 import，
# 组合纪律是 `check --select I --fix` 然后 `format`，HLD §3.3.1）。
extend-select = ["I"]

[tool.pyright]
# 档位显式写 standard：对齐上游官方默认，不用 fork 的 recommended 档
# （HLD §3.3.7 / §3.4：fork 默认档会静默改判）。
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__"]

# 一个含义只有一个所有者（HLD §3.3.5）：未用 import/变量/类、重复 import
# 归 ruff（F401 等）独占，pyright 系对应规则显式关闭。
reportUnusedImport = false
reportUnusedVariable = false
reportUnusedClass = false
reportDuplicateImport = false
